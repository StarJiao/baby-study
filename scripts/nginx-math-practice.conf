server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name over.mingxing.work www.over.mingxing.work;

    root /var/www/math-practice;
    index index.html;

    # SPA：未匹配到文件时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源（JS/CSS/字体）长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    access_log /var/log/nginx/math-practice.access.log;
    error_log  /var/log/nginx/math-practice.error.log;
}
